name: Deploy Cloudforge to Github Actions

on:
  push:
    branches:
      - main
  workflow-dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v6

      - name: Check Homepage
        run: test -s apps/index.html
      
      - name: Prepare Website
        run: |
          mkdir -p public
          cp -r apps/. public/
          test -s public/index.html

      - name: Configure Github pages
        uses: actions/configure-pages@v5

      - name: Upload Website Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public/
  
  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4 