name: CloudForge CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check-homepage:
    runs-on : ubuntu-latest
    env:
      APP_ENV: development

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v6

      - name: Check Homepage
        run : test -s apps/index.html

      - name: Check Directory
        run: test -d apps
      
      - name: HTML validation
        run: |
          npx --yes html-validate apps/index.html
      
      - name: Show Application environment
        run: echo "Environment is $APP_ENV"
      
      - name: Verify Secret Exists
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          if [ -n "$DEMO_SECRET" ]; then
            echo "Secret is Configured"
            echo "$DEMO-SECRET"
          else
            echo "Secret is not configured"
            exit 1
          fi