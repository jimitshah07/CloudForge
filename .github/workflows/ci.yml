name: CloudForge CI/CD

on:
  push:
    branches:
      - main
    pull_request:
      branches:
        - main

jobs:
  check-homepage:
    runs-on : ubuntu-latest

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v6

      - name: Check Homepage
        run : test -s apps/index.html

      - name: Check Directory
        run: test -d apps
      
      - name: HTML validation
        run: |
          npx --yes html-validate apps/index.html
